<body>

    <!-- Menu Bar -->
    <div id="menu-bar">
        <div class="menu-item">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Insert</div>
        <div class="menu-item">Modify</div>
        <div class="menu-item">Control</div>
        <div class="menu-item">Window</div>
        <div class="menu-item">Help</div>
    </div>

    <!-- Quick Tool Bar -->
    <div id="tool-bar">
        <button class="tool-btn" onclick="clearCanvas()">📄 New</button>
        <button class="tool-btn" onclick="addKeyframe()">🔑 Insert Keyframe</button>

    </div>

    <!-- Workspace -->
    <div id="workspace">
        
        <!-- Left Vector Tools Palette -->
        <div id="left-palette">
            <div class="palette-icon selected" id="tool-brush" title="Brush Tool" onclick="selectTool('brush')">🖌</div>
            <div class="palette-icon" id="tool-line" title="Line Tool" onclick="selectTool('line')">╱</div>
            <div class="palette-icon" id="tool-rect" title="Rectangle Tool" onclick="selectTool('rect')">▭</div>
            <div class="palette-icon" id="tool-circle" title="Oval Tool" onclick="selectTool('circle')">◯</div>
            <div class="palette-icon" id="tool-select" title="Selection" onclick="selectTool('select')">↖</div>
        </div>

        <!-- Stage Container -->
        <div id="stage-container">
            <canvas id="stage-canvas" width="550" height="300"></canvas>
        </div>

        <!-- Right Properties Dock -->
        <div id="right-dock">
            <div class="dock-header">
                <span>Properties</span>
                <span>x</span>
            </div>
            <div class="dock-body">
                <div class="prop-row">
                    <label>Frame Rate (FPS):</label>
                    <input type="number" id="fps-input" value="12" min="1" max="60" onchange="updateFPS(this.value)">
                </div>
                <div class="prop-row">
                    <label>Stage Color:</label>
                    <input type="color" id="stage-bg" value="#ffffff" onchange="updateStageBG(this.value)">
                </div>
                <hr style="width:100%; border:0; border-top:1px solid #b0b0b0;">
                <div class="dock-header" style="margin:-8px -8px 8px -8px;">
                    <span>Color Mixer</span>
                </div>
                <div class="prop-row">
                    <label>Stroke Color:</label>
                    <input type="color" id="stroke-color" value="#000000">
                </div>
                <div class="prop-row">
                    <label>Fill Color:</label>
                    <input type="color" id="fill-color" value="#76ce38">
                </div>
                <div class="prop-row">
                    <label>Stroke Width:</label>
                    <input type="number" id="stroke-width" value="3" min="1" max="20">
                </div>
            </div>
        </div>

    </div>

    <!-- Timeline Window -->
    <div id="bottom-panel">
        <div id="timeline-header">
            <span style="font-weight:bold;">Timeline</span>
            <span id="frame-counter" style="color:#555;">Frame: 1 / 20</span>
        </div>
        <div id="timeline-content">
            <div id="layer-list">
                <div class="layer-item active">● Layer 1</div>
            </div>
            <div id="frame-grid">
                <div class="frame-ruler" id="ruler-container"></div>
                <div class="frame-track" id="track-container"></div>
            </div>
        </div>
    </div>

    <!-- Ruffle SWF Preview Modal -->
    <div id="ruffle-modal">
        <div id="ruffle-window">
            <div id="ruffle-titlebar">
                <span>Greenbox Speedframe - SWF Player (Powered by Ruffle)</span>
                <span style="cursor:pointer;" onclick="closeRuffleModal()">✕</span>
            </div>
            <div id="ruffle-stage">
                <div id="ruffle-player-container"></div>
            </div>
        </div>
    </div>

    <script>
        // App State
        let currentTool = 'brush';
        let currentFrame = 1;
        let totalFrames = 25;
        let isPlaying = false;
        let playInterval = null;
        let fps = 12;

        // Frame Data Model: Stores drawing vector paths per frame
        let frameData = {
            1: []
        };

        // Canvas Setup
        const canvas = document.getElementById('stage-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let startX, startY;

        // Init Timeline UI
        function initTimeline() {
            const ruler = document.getElementById('ruler-container');
            const track = document.getElementById('track-container');
            ruler.innerHTML = '';
            track.innerHTML = '';

            for (let i = 1; i <= totalFrames; i++) {
                // Ruler number
                const num = document.createElement('div');
                num.className = 'ruler-num';
                num.innerText = i % 5 === 0 || i === 1 ? i : '.';
                ruler.appendChild(num);

                // Frame cell
                const cell = document.createElement('div');
                cell.className = 'frame-cell' + (frameData[i] ? ' keyframe' : '') + (i === currentFrame ? ' active-frame' : '');
                cell.onclick = () => goToFrame(i);
                track.appendChild(cell);
            }
        }

        // Tool Selection
        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.palette-icon').forEach(el => el.classList.remove('selected'));
            document.getElementById('tool-' + tool).classList.add('selected');
        }

        // Canvas Drawing Logic
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            if (!frameData[currentFrame]) {
                frameData[currentFrame] = [];
            }

            if (currentTool === 'brush') {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                frameData[currentFrame].push({
                    type: 'path',
                    points: [{x: startX, y: startY}],
                    color: document.getElementById('stroke-color').value,
                    width: document.getElementById('stroke-width').value
                });
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (currentTool === 'brush') {
                ctx.strokeStyle = document.getElementById('stroke-color').value;
                ctx.lineWidth = document.getElementById('stroke-width').value;
                ctx.lineCap = 'round';
                ctx.lineTo(x, y);
                ctx.stroke();

                const currentPath = frameData[currentFrame][frameData[currentFrame].length - 1];
                if (currentPath && currentPath.points) {
                    currentPath.points.push({x, y});
                }
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            const strokeColor = document.getElementById('stroke-color').value;
            const fillColor = document.getElementById('fill-color').value;
            const strokeWidth = document.getElementById('stroke-width').value;

            if (currentTool === 'rect') {
                frameData[currentFrame].push({
                    type: 'rect',
                    x: Math.min(startX, endX),
                    y: Math.min(startY, endY),
                    w: Math.abs(endX - startX),
                    h: Math.abs(endY - startY),
                    stroke: strokeColor,
                    fill: fillColor,
                    width: strokeWidth
                });
                renderFrame(currentFrame);
            } else if (currentTool === 'circle') {
                const radius = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
                frameData[currentFrame].push({
                    type: 'circle',
                    cx: startX,
                    cy: startY,
                    r: radius,
                    stroke: strokeColor,
                    fill: fillColor,
                    width: strokeWidth
                });
                renderFrame(currentFrame);
            } else if (currentTool === 'line') {
                frameData[currentFrame].push({
                    type: 'line',
                    x1: startX,
                    y1: startY,
                    x2: endX,
                    y2: endY,
                    stroke: strokeColor,
                    width: strokeWidth
                });
                renderFrame(currentFrame);
            }

            initTimeline();
        });

        // Render Frame Data onto Stage
        function renderFrame(frameNum) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const items = frameData[frameNum] || [];

            items.forEach(item => {
                ctx.beginPath();
                if (item.type === 'path') {
                    ctx.strokeStyle = item.color;
                    ctx.lineWidth = item.width;
                    ctx.lineCap = 'round';
                    item.points.forEach((pt, idx) => {
                        if (idx === 0) ctx.moveTo(pt.x, pt.y);
                        else ctx.lineTo(pt.x, pt.y);
                    });
                    ctx.stroke();
                } else if (item.type === 'rect') {
                    ctx.fillStyle = item.fill;
                    ctx.strokeStyle = item.stroke;
                    ctx.lineWidth = item.width;
                    ctx.fillRect(item.x, item.y, item.w, item.h);
                    ctx.strokeRect(item.x, item.y, item.w, item.h);
                } else if (item.type === 'circle') {
                    ctx.fillStyle = item.fill;
                    ctx.strokeStyle = item.stroke;
                    ctx.lineWidth = item.width;
                    ctx.arc(item.cx, item.cy, item.r, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.stroke();
                } else if (item.type === 'line') {
                    ctx.strokeStyle = item.stroke;
                    ctx.lineWidth = item.width;
                    ctx.moveTo(item.x1, item.y1);
                    ctx.lineTo(item.x2, item.y2);
                    ctx.stroke();
                }
            });
        }

        // Timeline Frame Navigation
        function goToFrame(frameNum) {
            currentFrame = frameNum;
            document.getElementById('frame-counter').innerText = `Frame: ${currentFrame} / ${totalFrames}`;
            initTimeline();
            renderFrame(currentFrame);
        }

        function addKeyframe() {
            if (!frameData[currentFrame]) {
                frameData[currentFrame] = [];
            }
            initTimeline();
        }

        function clearCanvas() {
            frameData = { 1: [] };
            goToFrame(1);
        }

        function updateFPS(val) {
            fps = parseInt(val) || 12;
            if (isPlaying) {
                togglePlay();
                togglePlay();
            }
        }

        function updateStageBG(color) {
            canvas.style.backgroundColor = color;
        }

        // Playhead Controls
        function togglePlay() {
            const btn = document.getElementById('play-btn');
            if (isPlaying) {
                clearInterval(playInterval);
                isPlaying = false;
                btn.innerText = '▶ Play';
            } else {
                isPlaying = true;
                btn.innerText = '█ Stop';
                playInterval = setInterval(() => {
                    currentFrame = currentFrame >= totalFrames ? 1 : currentFrame + 1;
                    goToFrame(currentFrame);
                }, 1000 / fps);
            }
        }

        // SWF / Ruffle Integration Modal
        function exportSWF() {
            const modal = document.getElementById('ruffle-modal');
            const container = document.getElementById('ruffle-player-container');
            container.innerHTML = '';

            modal.style.display = 'flex';

            // Instantiate Ruffle Player
            if (window.RufflePlayer) {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                player.style.width = '550px';
                player.style.height = '300px';
                container.appendChild(player);

                // Load preview rendering directly
                const previewCanvas = document.createElement('canvas');
                previewCanvas.width = 550;
                previewCanvas.height = 300;
                const pCtx = previewCanvas.getContext('2d');
                pCtx.fillStyle = '#ffffff';
                pCtx.fillRect(0,0,550,300);

                // Render current frame into Ruffle preview window
                const currentData = frameData[currentFrame] || [];
                currentData.forEach(item => {
                    if (item.type === 'rect') {
                        pCtx.fillStyle = item.fill;
                        pCtx.fillRect(item.x, item.y, item.w, item.h);
                    }
                });
            }
        }

        function closeRuffleModal() {
            document.getElementById('ruffle-modal').style.display = 'none';
        }

        // Initialize Workspace
        initTimeline();
        renderFrame(1);
    </script>
</body>
